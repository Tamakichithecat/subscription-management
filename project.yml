name: SubTrackFamily

# ドキュメントをXcodeプロジェクトナビゲータに表示する（コンパイル対象外）
fileGroups:
  - CLAUDE.md
  - agent.md
  - skills.md
  - docs
  - README.md

options:
  bundleIdPrefix: com.tamakichi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"

targets:
  SubTrackFamily:
    type: application
    platform: iOS
    sources:
      - path: SubTrackFamily
    resources:
      - path: SubTrackFamily/Resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: KeychainAccess
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.tamakichi.subtrackfamily
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SubTrackFamily/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

  SubTrackFamilyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SubTrackFamilyUITests
    dependencies:
      - target: SubTrackFamily
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.tamakichi.subtrackfamily.uitests
        DEVELOPMENT_TEAM: ""
        TEST_HOST: ""

schemes:
  SubTrackFamily:
    build:
      targets:
        SubTrackFamily: all
        SubTrackFamilyUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: SUPABASE_URL
          value: ""
          isEnabled: true
        - variable: SUPABASE_ANON_KEY
          value: ""
          isEnabled: true
    test:
      config: Debug
      targets:
        - name: SubTrackFamilyUITests
          parallelizable: false
          randomExecutionOrder: false
      environmentVariables:
        - variable: SUPABASE_URL
          value: ""
          isEnabled: true
        - variable: SUPABASE_ANON_KEY
          value: ""
          isEnabled: true
        - variable: UAT_TEST_EMAIL
          value: ""
          isEnabled: true
        - variable: UAT_TEST_PASSWORD
          value: ""
          isEnabled: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
